<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de nuevos sensores</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Agregar dispositivos a la base de datos</h1>
        </header>
        
        <form class="card">
                <h2>Agregar dispositivo</h2>
                <input type="text" id="id" placeholder="Id" required><br><br>
                <input type="text" id="token" placeholder="Token" required><br><br>
                <input type="text" id="location" placeholder="location" required><br><br>
                <button class="btn-primary" type="submit">Enviar</button>
        </form>

        <script type="module" src="./app.js"></script>
    </div>
</body>
</html>
